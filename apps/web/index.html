<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f8fb" />
    <title>Connect Anything</title>
    <meta name="description" content="Turn an Anchor program into a button anyone can press from Base, Arbitrum or Ethereum. Aurora Intents Connect bridges the money and runs the instructions on Solana." />
    <!-- first, because AppKit hands the first icon link to wallets as the app's icon, and a 180 px PNG suits them best.
         The PNGs are the mark of favicon.svg: at 32 px on nothing, and at 128 on a white 180 px square, whose corners iOS
         rounds itself. favicon.svg turns light on a dark tab; the PNG, for browsers without SVG icons, cannot. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- og.png is drawn by /dev/og (src/pages/OgImage.tsx); vite preview makes its URL absolute (vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Connect Anything" />
    <meta property="og:title" content="Any Solana program. One signature from any EVM chain." />
    <meta property="og:description" content="Turn an Anchor program into a button anyone can press from Base, Arbitrum or Ethereum. Aurora Intents Connect bridges the money and runs the instructions on Solana." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Connect Anything: Base, Arbitrum and Ethereum, through Aurora Intents Connect, to a Solana program." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Any Solana program. One signature from any EVM chain." />
    <meta name="twitter:description" content="Turn an Anchor program into a button anyone can press from Base, Arbitrum or Ethereum. Aurora Intents Connect bridges the money and runs the instructions on Solana." />
    <meta name="twitter:image" content="/og.png" />
    <style>
      html { background: #f6f8fb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
