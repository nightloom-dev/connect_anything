[package]
name = "sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Simulates a Connect Anything recipe on a fork of Solana mainnet"

[dependencies]
# The fork. The solana-* versions below are the ones litesvm 0.18.1 asks for, so their types are its types.
litesvm = { version = "=0.18.1", features = ["precompiles"] }
agave-feature-set = "4.3.0"
solana-account = "4.3.0"
solana-address = { version = "~2.7.0", features = ["curve25519", "decode"] }
solana-instruction-error = "~2.5.0"
solana-message = { version = "4.2.4", features = ["wincode"] }
solana-signature = "~3.5.2"
solana-transaction = "4.1.5"
solana-transaction-error = "~3.4.0"
# The legacy IDL converter, Anchor's own
anchor-lang-idl = { version = "=0.2.0", features = ["convert"] }

axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# to read the zlib-compressed on-chain IDL account in packages/core/test/fixtures
miniz_oxide = "0.8"
# to call the router in tests, the version axum already uses
tower = { version = "0.5", features = ["util"] }
